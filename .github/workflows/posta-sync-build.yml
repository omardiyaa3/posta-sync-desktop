name: Posta Sync Build (All Platforms)

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo

env:
  APPLICATION_NAME: "Posta Sync"
  APPLICATION_SHORTNAME: "PostaSync"
  APPLICATION_VENDOR: "WorldPosta"
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

jobs:
  #############################################
  # macOS Build (Universal - arm64 + x86_64)
  #############################################
  build-macos:
    name: macOS Build
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    env:
      CRAFT_TARGET: ${{ matrix.arch == 'arm64' && 'macos-clang-arm64' || 'macos-64-clang' }}
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Homebrew dependencies
        run: |
          brew install inkscape create-dmg

      - name: Clone Craft Master
        run: |
          git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git "$CRAFT_MASTER_LOCATION"

      - name: Setup Craft and install dependencies
        run: |
          python "$CRAFT_MASTER_LOCATION/CraftMaster.py" \
            --config "$CRAFT_MASTER_CONFIG" \
            --target "$CRAFT_TARGET" \
            -c --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|next|"

          python "$CRAFT_MASTER_LOCATION/CraftMaster.py" \
            --config "$CRAFT_MASTER_CONFIG" \
            --target "$CRAFT_TARGET" \
            -c --add-blueprint-repository "https://github.com/nextcloud/desktop-client-blueprints.git|next|"

          python "$CRAFT_MASTER_LOCATION/CraftMaster.py" \
            --config "$CRAFT_MASTER_CONFIG" \
            --target "$CRAFT_TARGET" \
            -c craft

          python "$CRAFT_MASTER_LOCATION/CraftMaster.py" \
            --config "$CRAFT_MASTER_CONFIG" \
            --target "$CRAFT_TARGET" \
            -c --install-deps nextcloud-client

      - name: Build Posta Sync Client
        run: |
          python "$CRAFT_MASTER_LOCATION/CraftMaster.py" \
            --config "$CRAFT_MASTER_CONFIG" \
            --target "$CRAFT_TARGET" \
            -c \
            --options nextcloud-client.srcDir="${{ github.workspace }}" \
            --options nextcloud-client.buildTests=False \
            nextcloud-client

      - name: Package DMG
        run: |
          BUILD_DIR="${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build"
          if [ -d "$BUILD_DIR" ]; then
            cd "$BUILD_DIR"
            # Create DMG if app bundle exists
            if [ -d "*.app" ] || [ -d "bin/*.app" ]; then
              echo "App bundle found, packaging..."
            fi
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostaSync-macOS-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build/*.dmg
            ${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build/*.app
          if-no-files-found: warn
          retention-days: 30

  #############################################
  # Windows Build (x64)
  #############################################
  build-windows:
    name: Windows Build
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inkscape
        shell: pwsh
        run: |
          choco install inkscape -y

      - name: Clone Craft Master
        shell: pwsh
        run: |
          git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git "${{ env.CRAFT_MASTER_LOCATION }}"

      - name: Setup Craft and install dependencies
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|next|"
          craft --add-blueprint-repository "https://github.com/nextcloud/desktop-client-blueprints.git|next|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Build Posta Sync Client
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir "${{ github.workspace }}" nextcloud-client

      - name: Package Installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --package nextcloud-client

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostaSync-Windows-x64
          path: |
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.exe
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.msi
          if-no-files-found: warn
          retention-days: 30

  #############################################
  # Linux Build (AppImage)
  #############################################
  build-linux:
    name: Linux AppImage Build
    runs-on: ubuntu-latest
    container: ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el8-6.8.3-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build AppImage
        id: build-appimage
        env:
          BUILDNR: ${{ github.run_id }}
          VERSION_SUFFIX: ${{ github.ref_name }}
        run: |
          BUILDNR=${GITHUB_RUN_ID} \
          VERSION_SUFFIX=${GITHUB_REF_NAME} \
          BUILD_UPDATER=ON \
          DESKTOP_CLIENT_ROOT=$(pwd) \
          EXECUTABLE_NAME=postasync \
          QT_BASE_DIR=/opt/qt \
          OPENSSL_ROOT_DIR=/usr/local/lib64 \
          /bin/bash -c "./admin/linux/build-appimage.sh"

          # Find and rename the AppImage
          APPIMAGE=$(find . -name "*.AppImage" -type f | head -1)
          if [ -n "$APPIMAGE" ]; then
            NEW_NAME="PostaSync-$(uname -m).AppImage"
            mv "$APPIMAGE" "$NEW_NAME"
            echo "APPIMAGE_NAME=$NEW_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostaSync-Linux-AppImage
          path: "*.AppImage"
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  #############################################
  # Create Release (on tag push)
  #############################################
  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: find artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Posta Sync ${{ github.ref_name }}
          body: |
            ## Posta Sync ${{ github.ref_name }}

            WorldPosta Desktop Sync Client

            ### Downloads
            - **macOS (Apple Silicon)**: PostaSync-macOS-arm64
            - **macOS (Intel)**: PostaSync-macOS-x86_64
            - **Windows**: PostaSync-Windows-x64
            - **Linux**: PostaSync-Linux-AppImage

            ### Installation
            - **macOS**: Open the DMG and drag to Applications
            - **Windows**: Run the installer (.exe)
            - **Linux**: Make AppImage executable and run

          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
